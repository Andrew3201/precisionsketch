<style>
html,body{margin:0}body{font:14px system-ui,sans-serif}[hidden]{display:none!important}
</style>
<style>
:root {
--chrome: #eef1f4;
--panel: #f8f9fb;
--raise: #ffffff;
--ink: #17212b;
--ink-2: #52606d;
--ink-3: #8894a1;
--line: #d3d9e0;
--line-2: #e3e7ec;
--accent: #c2570c;
--accent-soft: #fbe9dc;
--ok: #17212b;
--under: #1764d8;
--bad: #c9271c;
--bad-soft: #fde8e6;
--on-bad: #ffffff;
--cv-bg: #fcfdfe;
--cv-grid: #edf0f4;
--cv-grid-major: #dde2e9;
--cv-axis: #aab4c0;
--cv-defined: #17212b;
--cv-under: #1764d8;
--cv-conflict: #d42a1e;
--cv-select: #e06a0a;
--cv-hover: #f3a25b;
--cv-dim: #3b4856;
--cv-driven: #8894a1;
--cv-glyph-bg: #ffffff;
--cv-glyph-line: #b9c2cc;
--cv-glyph-fg: #3f6f4a;

--cv-infer: #1e8a4c;
--cv-page: #8894a1;
--cv-paste: #e4e8ed;

--rail-r: 268px;
}
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) {
--chrome: #161b21; --panel: #1b2128; --raise: #232a33; --ink: #e4e9ee; --ink-2: #a3afbb; --ink-3: #6f7c89;
--line: #313a45; --line-2: #262e37; --accent: #ff914d; --accent-soft: #3a2a1e; --ok: #e4e9ee; --under: #66a6ff;
--bad: #ff7366; --bad-soft: #3b2220; --on-bad: #240a07;
--cv-bg: #11151a; --cv-grid: #181d24; --cv-grid-major: #212831; --cv-axis: #4a5663; --cv-defined: #e4e9ee;
--cv-under: #5b9dff; --cv-conflict: #ff6658; --cv-select: #ff9a4a; --cv-hover: #b9703a; --cv-dim: #b3bfcb;
--cv-driven: #6f7c89; --cv-glyph-bg: #1f262e; --cv-glyph-line: #3b4652; --cv-glyph-fg: #7fd09a; --cv-region: #8ea3b8;
--cv-infer: #5fd08c; --cv-page: #6f7c89; --cv-paste: #0b0e12;
color-scheme: dark;
}
}
:root[data-theme="dark"] {
--chrome: #161b21; --panel: #1b2128; --raise: #232a33; --ink: #e4e9ee; --ink-2: #a3afbb; --ink-3: #6f7c89;
--line: #313a45; --line-2: #262e37; --accent: #ff914d; --accent-soft: #3a2a1e; --ok: #e4e9ee; --under: #66a6ff;
--bad: #ff7366; --bad-soft: #3b2220; --on-bad: #240a07;
--cv-bg: #11151a; --cv-grid: #181d24; --cv-grid-major: #212831; --cv-axis: #4a5663; --cv-defined: #e4e9ee;
--cv-under: #5b9dff; --cv-conflict: #ff6658; --cv-select: #ff9a4a; --cv-hover: #b9703a; --cv-dim: #b3bfcb;
--cv-driven: #6f7c89; --cv-glyph-bg: #1f262e; --cv-glyph-line: #3b4652; --cv-glyph-fg: #7fd09a; --cv-region: #8ea3b8;
--cv-infer: #5fd08c; --cv-page: #6f7c89; --cv-paste: #0b0e12;
color-scheme: dark;
}
html, body { height: 100%; }
body {
background: var(--chrome); color: var(--ink);
font: 13px/1.4 var(--sans);
overflow: hidden; overscroll-behavior: none;
-webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#app {
height: 100%;
display: grid;
grid-template-columns: var(--rail-l) minmax(0, 1fr) var(--rail-r);
grid-template-rows: auto auto minmax(0, 1fr) auto;
grid-template-areas: "doc doc doc" "tools tools tools" "left stage right" "status status status";
}
#docbar {
grid-area: doc; display: flex; align-items: center; gap: 4px;
padding: 5px 10px; border-bottom: 1px solid var(--line); background: var(--chrome); min-width: 0;
}
.brand { font-weight: 600; letter-spacing: .01em; margin-right: 10px; white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.brand svg { color: var(--accent); }
.spacer { flex: 1 1 auto; min-width: 4px; }
.btn {
height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--raise);
display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--chrome); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.quiet { border-color: transparent; background: transparent; }
.btn.quiet:hover { background: var(--line-2); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.seg, .btn, .brand { flex: 0 0 auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--raise); }
.seg button { height: 26px; padding: 0 12px; border: 0; background: transparent; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--chrome); }
#toolbar {
grid-area: tools; display: flex; align-items: stretch; gap: 0; padding: 0 6px;
border-bottom: 1px solid var(--line); background: var(--panel);
overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; min-width: 0;
}
.grp { display: flex; flex-direction: column; padding: 3px 8px 4px; border-right: 1px solid var(--line-2); flex: 0 0 auto; }
.grp:last-child { border-right: 0; }
.grp-label { font-size: 9.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); line-height: 1; padding: 2px 2px 3px; }
.grp-row { display: flex; gap: 1px; }
.tb {
width: 32px; height: 30px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--ink-2);
display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto;
}
.tb:hover { background: var(--line-2); color: var(--ink); }
.tb[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.tb svg, .btn svg { width: 18px; height: 18px; display: block; }
.rail { background: var(--panel); overflow-y: auto; overflow-x: hidden; min-width: 0; scrollbar-width: thin; }
#left { grid-area: left; border-right: 1px solid var(--line); }
#right { grid-area: right; border-left: 1px solid var(--line); }
.sec { padding: 10px 12px 12px; border-bottom: 1px solid var(--line-2); }
.sec h2 { margin: 0 0 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.row { display: grid; grid-template-columns: 78px minmax(0, 1fr); align-items: center; gap: 6px; min-height: 26px; }
.row + .row { margin-top: 4px; }
.row.tight { grid-template-columns: 46px minmax(0, 1fr); }
.row.tight .field[data-kind="hex"] { padding: 0 5px; min-width: 66px; }
.row > label, .row > .lab { color: var(--ink-2); }
.field {
width: 100%; height: 26px; padding: 0 7px; border: 1px solid var(--line); border-radius: 3px; background: var(--raise);
font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 0;
}
select.field { font-family: var(--sans); padding: 0 4px; }
.field:disabled { opacity: .55; }
.pair { display: flex; gap: 6px; align-items: center; min-width: 0; }
.check { display: flex; align-items: center; gap: 7px; min-height: 24px; color: var(--ink-2); }
.check input { margin: 0; accent-color: var(--accent); }
.hint { color: var(--ink-3); font-size: 12px; line-height: 1.45; margin: 0; }
.hint + .hint { margin-top: 6px; }
.kv { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink); overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; border: 1px solid var(--line); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); }
.pill.under { color: var(--under); }
.pill.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.list li { display: flex; align-items: center; gap: 7px; min-height: 26px; padding: 1px 4px 1px 6px; border-radius: 3px; min-width: 0; }
.list li.click { cursor: pointer; }
.list li.click:hover, .list li.hot { background: var(--line-2); }
.list li.on { background: var(--accent-soft); }
.list li .grow { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list li.bad .grow { color: var(--bad); }
.x { width: 22px; height: 22px; border: 0; background: transparent; color: var(--ink-3); border-radius: 3px; flex: 0 0 auto; line-height: 1; font-size: 14px; }
.x:hover { background: var(--bad-soft); color: var(--bad); }
.sw { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--line); flex: 0 0 auto; background-color: #fff; }
.sw.none { background-image: linear-gradient(135deg, transparent 46%, #d42a1e 46%, #d42a1e 54%, transparent 54%); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.swatches button { width: 18px; height: 18px; padding: 0; border-radius: 3px; border: 1px solid var(--line); }
.swatches button:hover { transform: scale(1.12); }
input[type="color"] { width: 30px; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--raise); flex: 0 0 auto; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.btn.small { height: 24px; padding: 0 8px; font-size: 12px; }
.btnrow.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.btnrow.grid2 .btn { justify-content: center; }
.btn.small svg { width: 14px; height: 14px; }
.btnrow + .btnrow { margin-top: 6px; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
.sec-h h2 { margin: 0; }
.layers { list-style: none; margin: 0 0 8px; padding: 0; }
.layer { display: flex; align-items: center; gap: 1px; min-height: 30px; padding: 2px; border: 1px solid transparent; border-radius: 4px; cursor: pointer; }
.layer:hover { background: var(--line-2); }
.layer.active { background: var(--accent-soft); border-color: var(--accent); }
.layer.off .lname { color: var(--ink-3); }
.lb { width: 24px; height: 24px; border: 0; background: transparent; color: var(--ink-2); border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto; }
.lb:hover { background: var(--line); color: var(--ink); }
.lb svg { width: 16px; height: 16px; display: block; }
.lb[aria-pressed="true"] { color: var(--accent); }
.lname { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; font-weight: 500; }
.lname-in { flex: 1 1 auto; height: 24px; font-family: var(--sans); }
.field.lop { flex: 0 0 36px; width: 36px; height: 22px; padding: 0 3px; text-align: right; font-size: 11px; }
.layer.drop-above { box-shadow: inset 0 2px 0 var(--accent); }
.layer.drop-below { box-shadow: inset 0 -2px 0 var(--accent); }
.layer.drop-into { outline: 2px dashed var(--accent); outline-offset: -2px; }
.litems { list-style: none; padding: 1px 0 6px 20px; }
.litems .list li { min-height: 24px; }
.litems li.empty { color: var(--ink-3); font-size: 12px; }
.litems li.ingrp { padding-left: 20px; }
.grp-row svg { width: 14px; height: 14px; color: var(--ink-3); flex: 0 0 auto; }
.sw.txt { display: inline-flex; align-items: center; justify-content: center; font: 600 11px/1 var(--sans); background: var(--raise); }
.aligns { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; margin-top: 8px; }
.aligns .tb { width: 100%; }
.aligns .tb[disabled] { opacity: .35; cursor: default; background: transparent; }
textarea.field.tx { height: auto; min-height: 58px; padding: 5px 7px; font: 13px/1.35 var(--sans); resize: vertical; margin: 0 0 6px; display: block; }
.tg { width: 26px; height: 26px; border: 1px solid var(--line); border-radius: 3px; background: var(--raise); flex: 0 0 auto; padding: 0; }
.tg[aria-pressed="true"] { background: var(--ink); color: var(--chrome); border-color: var(--ink); }
.seg.small button { height: 24px; padding: 0 9px; font-size: 12px; }
.spc { flex: 0 0 80px; }
kbd { font-family: var(--mono); font-size: 11px; padding: 0 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--raise); color: var(--ink-2); }
#stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; background: var(--cv-bg); overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#dimedit {
position: absolute; width: 96px; height: 26px; margin: -13px 0 0 -48px; text-align: center;
border: 1.5px solid var(--accent); border-radius: 3px; background: var(--raise); color: var(--ink);
font-family: var(--mono); font-size: 12.5px; z-index: 5;
}
#toast {
position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px));
padding: 8px 12px; border-radius: 5px; background: var(--ink); color: var(--chrome); font-size: 12.5px; line-height: 1.45;
box-shadow: 0 4px 18px rgba(0, 0, 0, .22); z-index: 6;
}
#toast.bad { background: var(--bad); color: var(--on-bad); }
#toast ul { margin: 4px 0 0; padding-left: 18px; }
#toolopts {
position: absolute; left: 10px; top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--raise); z-index: 4;
font-size: 12px; max-width: calc(100% - 20px); box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
}
#toolopts .field { width: 62px; height: 24px; }
#toolopts label, #toolopts .lab { color: var(--ink-2); white-space: nowrap; }
#toolopts label:not(:first-child) { margin-left: 6px; }
.vrow { display: flex; align-items: center; gap: 4px; min-height: 28px; color: var(--ink-3); }
.vrow .field:first-child { flex: 0 0 62px; font-family: var(--sans); }
.vrow .field { flex: 1 1 auto; padding: 0 5px; color: var(--ink); }
.vrow .x { flex: 0 0 20px; width: 20px; }
.vval { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); padding: 0 0 4px 76px; overflow-wrap: anywhere; }
.sec .row + .vval { padding-left: 84px; }
#viewtag {
position: absolute; left: 10px; top: 8px; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
color: var(--ink-3); pointer-events: none;
}
#example {
position: absolute; right: 10px; top: 8px; display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px;
border: 1px solid var(--line); border-radius: 5px; background: var(--raise); color: var(--ink-2); font-size: 12px; z-index: 4;
max-width: calc(100% - 20px);
}
#status {
grid-area: status; display: flex; align-items: center; gap: 14px; padding: 3px 10px; min-height: 26px;
border-top: 1px solid var(--line); background: var(--chrome); color: var(--ink-2); font-size: 12px; min-width: 0;
}
#status .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
#coords { min-width: 168px; }
#hint { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu {
position: absolute; z-index: 20; min-width: 190px; padding: 4px; background: var(--raise); border: 1px solid var(--line);
border-radius: 5px; box-shadow: 0 8px 24px rgba(0, 0, 0, .16);
}
.menu button { display: flex; width: 100%; justify-content: space-between; gap: 18px; padding: 6px 9px; border: 0; background: transparent; border-radius: 3px; text-align: left; }
.menu button:hover { background: var(--line-2); }
.menu hr { border: 0; border-top: 1px solid var(--line-2); margin: 4px 0; }
#scrim { position: fixed; inset: 0; background: rgba(10, 14, 18, .45); z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; }
.dialog {
width: min(520px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
box-shadow: 0 16px 48px rgba(0, 0, 0, .3); padding: 16px 18px 14px;
}
.dialog h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
.dialog .row { grid-template-columns: 110px minmax(0, 1fr); }
.dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.dialog .note { margin: 10px 0 0; padding: 8px 10px; border-radius: 4px; background: var(--line-2); color: var(--ink-2); font-size: 12px; line-height: 1.45; }
.preview {
margin-top: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 10px; text-align: center; overflow: auto; max-height: 300px;
background-color: #fff;
background-image: linear-gradient(45deg, #e9ecef 25%, transparent 25%, transparent 75%, #e9ecef 75%), linear-gradient(45deg, #e9ecef 25%, transparent 25%, transparent 75%, #e9ecef 75%);
background-size: 14px 14px; background-position: 0 0, 7px 7px;
}
.preview img { max-width: 100%; max-height: 260px; }
textarea.code { width: 100%; height: 150px; margin-top: 10px; font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; background: var(--raise); color: var(--ink); padding: 6px; resize: vertical; }
.dialog.wide { width: min(880px, 100%); }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 6px 22px; align-items: start; }
.keys section h2 { margin: 6px 0 4px; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.keys div { display: flex; justify-content: space-between; gap: 8px; min-height: 22px; align-items: center; font-size: 12.5px; }
.keys .ks { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
.keys kbd { white-space: nowrap; }
#typein {
position: absolute; z-index: 5; display: flex; flex-direction: column; gap: 2px; padding: 4px 5px 5px;
border: 1.5px solid var(--accent); border-radius: 4px; background: var(--raise); box-shadow: 0 3px 12px rgba(0, 0, 0, .14);
}
#typein[hidden] { display: none; }
#typein-l { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
#typein-i { width: 128px; height: 24px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); color: var(--ink); font-family: var(--mono); font-size: 12.5px; padding: 0 6px; }
#typein-i.bad { border-color: var(--bad); }
.only-narrow { display: none; }
@media (max-width: 940px) {
#app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "doc" "tools" "stage" "status"; }
.rail { position: fixed; top: 0; bottom: 0; z-index: 25; width: min(280px, 86vw); box-shadow: 0 0 30px rgba(0, 0, 0, .28); }
#left { left: 0; } #right { right: 0; }
.rail:not(.open) { display: none; }
.only-narrow { display: inline-flex; }
.brand span { display: none; }
#docbar { padding: 5px 8px; gap: 2px; }
.seg button { padding: 0 8px; }
#coords { min-width: 0; }
#zoom, .hide-narrow { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 480px) {
.brand, #btnFit { display: none; }
}
</style>
</head>
<body>

<div id="app">
  <header id="docbar">

function exampleDoc() {
const d = PS.newDoc(), E = d.entities;

const R = PS.addRect(d, 0, 0, 70, 40), [b, r, t, l] = R.lines;
PS.addCon(d, { type: 'coincident', refs: [R.p1, 'O'] });

dim({ type: 'distance', refs: [b], mode: 'aligned', value: 70 }, 35, -9);
dim({ type: 'distance', refs: [r], mode: 'aligned', value: 40 }, 79, 20);
const c1 = PS.addCircle(d, 15, 20, 6), c2 = PS.addCircle(d, 49, 20, 6);
dim({ type: 'distance', refs: [E[c1].c, l], value: 15 }, 7.5, 47);
dim({ type: 'distance', refs: [E[c1].c, b], value: 20 }, -9, 10);
dim({ type: 'diameter', refs: [c1], value: 12 }, 15 + 9, 20 + 11);
PS.addCon(d, { type: 'equal', refs: [c1, c2] });
PS.addCon(d, { type: 'horizontal', refs: [E[c1].c, E[c2].c] });
PS.trySolve(d);
const sys = PS.buildSystem(d), topo = PS.computeTopology(d, sys);

const plate = topo.faces.find(f => f.parent < 0);
if (plate) { plate.rec.fill = '#58a6f0'; plate.rec.stroke = '#17212b'; plate.rec.sw = 0.5; plate.rec.user = true; }

}
function onKey(e) {

const typing = tag === 'input' || tag === 'select' || tag === 'textarea';

if (e.key === 'Enter') { if (setDim(editing, e.target.value)) { closeDimEdit(); cv.focus({ preventScroll: true }); } else e.target.select(); e.preventDefault(); }
else if (e.key === 'Escape') { closeDimEdit(); cv.focus({ preventScroll: true }); e.preventDefault(); }
e.stopPropagation(); return;
}

const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

if (k === 'Escape' && document.querySelector('.menu')) { document.querySelector('.menu').remove(); return; }

else if (k === 'y' || (k === 'z' && e.shiftKey)) { travel(1); e.preventDefault(); }
else if (k === 's') { saveProject(); e.preventDefault(); }
else if (k === 'c' && !e.shiftKey) { if (copySel(false)) e.preventDefault(); }
else if (k === 'x' && !e.shiftKey) { if (copySel(true)) e.preventDefault(); }
else if (k === 'v' && !e.shiftKey) { pasteSel(); e.preventDefault(); }
else if (k === 'd' && !e.shiftKey) { duplicateSel(); e.preventDefault(); }

else if (k === 'g') { if (e.shiftKey) ungroupSel(); else groupSel(); e.preventDefault(); }

reorder(e.shiftKey ? (up ? 'front' : 'back') : (up ? 'forward' : 'backward'));
e.preventDefault();
}

}

}

endChainArc();

if (k === 'Tab') { setMode(st.mode === 'sketch' ? 'clean' : 'sketch'); e.preventDefault(); return; }
